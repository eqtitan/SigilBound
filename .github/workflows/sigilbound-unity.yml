name: Sigilbound Unity

# The native Unity version (unity/), built in parallel with the web/Capacitor app.
#
# - checks: on every push touching unity/**, runs the game-core tests (including parity with the
#   web game's own code), compiles the Unity client and editor scripts against Unity reference
#   assemblies (2021.3 nuget + stubs, then the real Unity 6 ones from the game-ci image) and
#   compiles the HLSL shaders with DXC. No Unity license needed.
# Order of the build jobs (one Unity license seat, so the three builds run one after another):
#   android -> linux-preview (build + smoke tour) -> publish-android -> windows
# - android: builds an APK with game-ci and uploads it (Sigilbound-Unity.apk and
#   Sigilbound-Unity-<version>-build<n>.apk) as the "sigilbound-unity-android" workflow artifact only.
#   It no longer publishes anything. Runs only when Unity license secrets exist; otherwise skipped.
# - linux-preview: right after android, builds a Linux player and runs the screenshot tour on it
#   headless in CI (xvfb + software GL + -sbShots=DIR, the same as tools/unity-shots.sh), checked by
#   tools/unity-smoke-check.sh: the tour reaches DONE, the battle/titan SBBUDGET lines show skinned>0,
#   and player.log has no Null/MissingReference or IndexOutOfRange exceptions from Sigilbound code.
#   The shots and logs are uploaded as the "sigilbound-unity-smoke" artifact on every run, pass or
#   fail. The Linux zip is published to the "unity-preview" release (not for players; agents use it
#   with tools/unity-shots.sh) even when the smoke fails, so a failure can be reproduced locally; its
#   release notes say whether the smoke passed.
# - publish-android: only when android built and the smoke passed, downloads the APK artifact and
#   publishes it to the "unity-latest" pre-release (the tester link; separate from android-latest; app
#   id com.sigilbound.unity, so both apps install side by side), replacing the files in place.
# - windows: after publish-android, builds a Windows 10+ (64-bit) test build and attaches it to the
#   same "unity-latest" release as Sigilbound-Windows.zip, also only if the smoke passed. It waits for
#   linux-preview so two builds never hold the Personal license seat at once, and for publish-android
#   so the two never edit the unity-latest release at the same moment.
# - Nothing is published unless the run is on main (github.ref == refs/heads/main): a
#   workflow_dispatch on another branch builds and smoke-tests, and only uploads workflow artifacts.
#   A broken build therefore never replaces the tester download; testers get each build about one
#   Linux build + smoke tour later than before (see the linux-preview job).
# - get-license-file: run by hand (Actions > Sigilbound Unity > Run workflow > task
#   "get-license-file") as a fallback if account activation doesn't work; see unity/README.md.
#
# Secrets (repo Settings > Secrets and variables > Actions), see unity/README.md:
#   UNITY_EMAIL, UNITY_PASSWORD   (required to build; a dedicated free Unity account)
#   UNITY_LICENSE                 (optional; a .ulf from the get-license-file task)
#   GH_SECRETS_TOKEN              (optional; lets get-license-file save UNITY_LICENSE for you)
#   ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEYSTORE_PASS, ANDROID_UPLOAD_KEY_ALIAS,
#   ANDROID_UPLOAD_KEY_PASS       (only for the manual "build-store-aab" task: the private Play upload key,
#                                  see docs/sigilbound/store/PLAY_CONSOLE.md; never the committed test key)

on:
  push:
    # Only main publishes to the download links; other branches (work in progress) never do.
    branches: [main]
    paths: ["unity/**", "public/game/models/**", "public/game/version.js", ".github/workflows/sigilbound-unity.yml"]
  pull_request:
    paths: ["unity/**", "public/game/models/**", ".github/workflows/sigilbound-unity.yml"]
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: ["build-apk", "build-store-aab", "get-license-file"]
        default: "build-apk"

permissions:
  contents: write

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || inputs.task == 'build-apk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Prepare hero models (so the APK budget and packed-model checks run; CI fails them if skipped)
        run: (cd unity/Tools~/models && npm ci --no-audit --no-fund && node prepare-models.mjs)
      - name: Game-core tests (rules, web parity, save codes, Trials, looks, layout, APK budget)
        run: dotnet run --project unity/Tests~
      - name: Hero uniqueness audit (no new near-twins; docs/sigilbound/UNIQUE.md)
        run: python3 "unity/Tools~/blenderforge/audit.py" --check
      - name: Compile check (Client + Editor scripts against Unity reference assemblies)
        run: dotnet build unity/Tests~/CompileCheck/Editor.csproj
      - name: Compile check of the Play Store variant (SB_STORE, no in-app updater)
        run: dotnet build unity/Tests~/CompileCheck/Client.csproj -p:ExtraDefines=SB_STORE -o "$RUNNER_TEMP/store-out"
      - name: Fetch the real Unity 6 assemblies (from the game-ci editor image; no Docker, no license)
        id: unityrefs
        # Streams the editor layer from Docker Hub and keeps only Editor/Data/Managed/*.dll. If Docker
        # Hub rate-limits us, the step is skipped with a warning; the stub-based check above still ran.
        continue-on-error: true
        run: python3 unity/Tools~/unity-refs/fetch_unity_refs.py "$RUNNER_TEMP/unity-managed"
      - name: Compile check against the real Unity 6000.0.58f1 assemblies (URP and glTFast still stubbed)
        if: steps.unityrefs.outcome == 'success'
        run: dotnet build unity/Tests~/CompileCheck/Editor.csproj -p:UnityManaged="$RUNNER_TEMP/unity-managed" -o "$RUNNER_TEMP/refs-out"
      - name: Shader check (HLSL passes compiled with DXC against URP 17's ShaderLibrary)
        # No Unity needed: unity/Tools~/shadercheck expands the multi_compile variants of each pass.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/dxc.tgz" https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.8.2407/linux_dxc_2024_07_31.x86_64.tar.gz
          echo "b58725ac191df0686994fb9d54d27ee8dd3f180b023d562733112a499ea1195c  $RUNNER_TEMP/dxc.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/dxc" && tar -xzf "$RUNNER_TEMP/dxc.tgz" -C "$RUNNER_TEMP/dxc"
          git clone -q --depth 1 --filter=blob:none --sparse -b 6000.0/staging https://github.com/Unity-Technologies/Graphics.git "$RUNNER_TEMP/graphics"
          git -C "$RUNNER_TEMP/graphics" sparse-checkout set Packages/com.unity.render-pipelines.core/ShaderLibrary Packages/com.unity.render-pipelines.core/Runtime Packages/com.unity.render-pipelines.universal/ShaderLibrary Packages/com.unity.render-pipelines.universal/Runtime Packages/com.unity.render-pipelines.universal-config
          for s in unity/Assets/Sigilbound/Client/Shaders/*.shader; do
            python3 unity/Tools~/shadercheck/shadercheck.py "$s" "$RUNNER_TEMP/graphics" "$RUNNER_TEMP/dxc/bin/dxc"
            python3 unity/Tools~/shadercheck/shadercheck.py "$s" "$RUNNER_TEMP/graphics" "$RUNNER_TEMP/dxc/bin/dxc" SHADER_API_MOBILE > /dev/null
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Do the parity fixtures still match the web game?
        # Regenerates the fixtures from public/game/*.js. A difference means the web game's rules
        # changed and the Unity core needs the same change (then commit the new fixtures).
        continue-on-error: true
        run: |
          node unity/Tests~/fixtures/make-fixtures.cjs
          if ! git diff --quiet -- unity/Tests~/fixtures/fixtures.json; then
            echo "::warning::The web game's rules changed since the Unity port. Port the change to unity/Assets/Sigilbound/Core and commit the regenerated unity/Tests~/fixtures/fixtures.json."
            git diff --stat -- unity/Tests~/fixtures/fixtures.json
            exit 1
          fi
      - name: Does the hero art (kit, builds, faces, colours) still match the web game?
        # Re-runs the web's own buildKit()/roleColors() (needs three from the root package) and
        # regenerates the art tables. A difference means three3d.mjs or art.js changed.
        continue-on-error: true
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node unity/Tests~/fixtures/make-hero-art.cjs
          node unity/Tests~/fixtures/make-role-colors.mjs
          node unity/Tests~/fixtures/make-kit-fixture.mjs
          if ! git diff --quiet -- unity/Tests~/fixtures unity/Assets/Sigilbound/Core/HeroArt.Generated.cs; then
            echo "::warning::The web game's hero art changed since the Unity port. Port the change to unity/Assets/Sigilbound/Core/Kit (KitBuilder / Looks) and commit the regenerated files."
            git diff --stat -- unity/Tests~/fixtures unity/Assets/Sigilbound/Core/HeroArt.Generated.cs
            exit 1
          fi

  secrets:
    if: github.event_name != 'workflow_dispatch' || inputs.task == 'build-apk'
    runs-on: ubuntu-latest
    outputs:
      can_build: ${{ steps.check.outputs.can_build }}
    steps:
      - id: check
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "can_build=true" >> "$GITHUB_OUTPUT"
            if [ -n "$UNITY_LICENSE" ]; then echo "Unity: license file + account (falls back to account activation if the file doesn't fit this machine)."
            else echo "Unity: account activation (Personal license via the Unity licensing client)."; fi
          else
            echo "can_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity APK build skipped: add the UNITY_EMAIL and UNITY_PASSWORD repository secrets to build it (see unity/README.md)."
          fi

  android:
    needs: [checks, secrets]
    if: needs.secrets.outputs.can_build == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: sigilbound-unity-release
      cancel-in-progress: false
    steps:
      - name: Free disk space (the Unity Android image is large)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Prepare hero models and build number
        run: |
          (cd unity/Tools~/models && npm ci --no-audit --no-fund && node prepare-models.mjs)
          echo "${{ github.run_number }}" > unity/build-number.txt
          VERSION=$(node -p "require('fs').readFileSync('public/game/version.js','utf8').match(/version: \"([^\"]+)\"/)[1]")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: unity/Library
          key: unity-library-android-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('unity/Assets/**') }}
          restore-keys: |
            unity-library-android-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-
            unity-library-android-
      - name: Build the APK (game-ci)
        id: apk1
        # Gradle downloads the Android build tools from Maven Central on every build; when Maven
        # answers 429 (Too Many Requests), the step fails before our code is built, so it is retried
        # once after a pause (below).
        continue-on-error: true
        # unity-builder v6 runs the game-ci CLI. With UNITY_EMAIL + UNITY_PASSWORD and no
        # UNITY_LICENSE it activates a Personal license through Unity's licensing client
        # ("personal" method); with UNITY_LICENSE it uses the file and falls back to the account.
        # The seat is returned when the job ends.
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          cliVersion: v0.1.77
          projectPath: unity
          targetPlatform: Android
          buildMethod: Sigilbound.EditorTools.BuildScript.Android
          versioning: None
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidPackage
          allowDirtyBuild: true
      - name: Wait before retrying the APK build
        if: steps.apk1.outcome == 'failure'
        run: sleep 180
      - name: Build the APK (retry after a failure)
        if: steps.apk1.outcome == 'failure'
        # unity-builder v6 runs the game-ci CLI. With UNITY_EMAIL + UNITY_PASSWORD and no
        # UNITY_LICENSE it activates a Personal license through Unity's licensing client
        # ("personal" method); with UNITY_LICENSE it uses the file and falls back to the account.
        # The seat is returned when the job ends.
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          cliVersion: v0.1.77
          projectPath: unity
          targetPlatform: Android
          buildMethod: Sigilbound.EditorTools.BuildScript.Android
          versioning: None
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidPackage
          allowDirtyBuild: true
      - name: Name the APK
        run: |
          # game-ci saves to its -customBuildPath (build/ in the workspace); local runs use unity/Builds.
          APK=$(find build unity/build unity/Builds -name '*.apk' 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then echo "::error::No APK was produced"; exit 1; fi
          cp "$APK" Sigilbound-Unity.apk
          cp Sigilbound-Unity.apk "Sigilbound-Unity-$VERSION-build$BUILD.apk"
          ls -la Sigilbound-Unity*.apk
      - name: APK size budget (Google Play's base download limit is 200 MB)
        run: |
          SIZE=$(stat -c %s Sigilbound-Unity.apk); LIMIT=190000000
          echo "APK: $SIZE bytes ($((SIZE / 1000000)) MB), budget $((LIMIT / 1000000)) MB"
          if [ "$SIZE" -gt "$LIMIT" ]; then echo "::error::APK is $((SIZE / 1000000)) MB, over the $((LIMIT / 1000000)) MB budget (Play's limit is 200 MB). See docs/sigilbound/APK_SIZE.md."; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sigilbound-unity-android
          # Both names publish-android puts on the release (the fixed tester link and the versioned copy).
          path: |
            Sigilbound-Unity.apk
            Sigilbound-Unity-*.apk
          if-no-files-found: error

  linux-preview:
    # Right after android (one license seat: never two builds at once), even if the APK build failed.
    needs: [checks, secrets, android]
    if: ${{ !cancelled() && needs.secrets.outputs.can_build == 'true' && github.event_name != 'pull_request' && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      smoke: ${{ steps.smoke.outputs.smoke }}
    concurrency:
      group: sigilbound-unity-preview-release
      cancel-in-progress: false
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Prepare hero models
        run: (cd unity/Tools~/models && npm ci --no-audit --no-fund && node prepare-models.mjs)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: unity/Library
          key: unity-library-linux-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('unity/Assets/**') }}
          restore-keys: |
            unity-library-linux-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-
            unity-library-linux-
      - name: Build the Linux preview (game-ci)
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          cliVersion: v0.1.77
          projectPath: unity
          targetPlatform: StandaloneLinux64
          buildName: Sigilbound
          buildMethod: Sigilbound.EditorTools.BuildScript.Linux
          versioning: None
          allowDirtyBuild: true
      - name: Zip the preview
        id: zip
        run: |
          BIN=$(find build unity/build unity/Builds -name 'Sigilbound.x86_64' 2>/dev/null | head -n 1)
          if [ -z "$BIN" ]; then echo "::error::No Linux build was produced"; exit 1; fi
          DIR=$(dirname "$BIN")
          sudo chown -R "$(id -u)" "$DIR" || true
          find "$DIR" -maxdepth 1 -name '*_BurstDebugInformation_DoNotShip' -exec rm -rf {} + || true
          rm -rf Sigilbound-Linux && cp -r "$DIR" Sigilbound-Linux
          zip -qr9 Sigilbound-Linux.zip Sigilbound-Linux
          ls -la Sigilbound-Linux.zip
      - name: Install xvfb and Mesa software OpenGL (for the smoke tour)
        run: |
          for i in 1 2 3; do
            sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
              xvfb xauth libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libglu1-mesa libxrandr2 libxcursor1 libxi6 libxinerama1 libasound2t64 \
              && break
            sleep 20
          done
          command -v xvfb-run
      - name: Smoke tour (screenshot mode, headless; same run as tools/unity-shots.sh)
        id: smoke
        timeout-minutes: 30
        run: |
          OUT="$PWD/unity-smoke"; rm -rf "$OUT" && mkdir -p "$OUT"
          BIN="$PWD/Sigilbound-Linux/Sigilbound.x86_64"; chmod +x "$BIN"
          START=$(date +%s)
          # Software GL (llvmpipe) is slow but enough for the tour. -force-glcore avoids Vulkan.
          LIBGL_ALWAYS_SOFTWARE=1 timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" \
            "$BIN" -screen-fullscreen 0 -screen-width 1280 -screen-height 720 -force-glcore \
            -logFile "$OUT/player.log" -sbShots="$OUT" || echo "player exited with $?"
          echo "Smoke tour took $(( $(date +%s) - START )) s; $(ls "$OUT"/*.png 2>/dev/null | wc -l) screenshots."
          if bash tools/unity-smoke-check.sh "$OUT"; then
            echo "smoke=passed" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Smoke tour failed (details above; shots and logs in the sigilbound-unity-smoke artifact). Nothing is published to unity-latest."
            exit 1
          fi
      - name: Upload the smoke shots and logs (every run, pass or fail)
        if: ${{ !cancelled() && steps.zip.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sigilbound-unity-smoke
          path: unity-smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish to the unity-preview release
        # Main only. Published even when the smoke failed (not for players; lets agents reproduce the
        # failure with tools/unity-shots.sh); the notes say which.
        if: ${{ !cancelled() && steps.zip.outcome == 'success' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE: ${{ steps.smoke.outputs.smoke == 'passed' && 'smoke tour passed' || 'SMOKE TOUR FAILED, not published to testers' }}
        run: |
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "retry $i: $*"; sleep $((i * 15)); done; return 1; }  # GitHub API 500s happen
          NOTES="Linux preview build for automated screenshots (tools/unity-shots.sh), commit ${GITHUB_SHA::7} (${SMOKE}). Not for players."
          if gh release view unity-preview >/dev/null 2>&1; then
            retry gh release upload unity-preview Sigilbound-Linux.zip --clobber
            retry gh release edit unity-preview --notes "$NOTES"
          else
            gh release create unity-preview Sigilbound-Linux.zip --prerelease --title "Sigilbound (Unity) Linux preview" --notes "$NOTES"
          fi

  # Publishes the APK that android built, but only once the Linux build of the same commit passed the
  # smoke tour. No Unity, no license seat: it just replaces the files on the unity-latest release.
  publish-android:
    needs: [android, linux-preview]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.android.result == 'success' && needs.linux-preview.outputs.smoke == 'passed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sigilbound-unity-latest-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: public/game/version.js
          sparse-checkout-cone-mode: false
      - name: Version and build number (as the android job computed them)
        run: |
          VERSION=$(node -p "require('fs').readFileSync('public/game/version.js','utf8').match(/version: \"([^\"]+)\"/)[1]")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sigilbound-unity-android
      - name: Check the APKs are there
        run: |
          ls -la Sigilbound-Unity*.apk
          test -s Sigilbound-Unity.apk && test -s "Sigilbound-Unity-$VERSION-build$BUILD.apk"
      - name: Publish to the unity-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_TAIL: >-
            The native Unity version, in progress alongside the web app. It installs as a separate app,
            "Sigilbound (Unity)", next to the regular Sigilbound app. To bring your progress over: in the
            regular app open Settings > Save code > Copy, then in the Unity app open Settings, tap Paste
            and Load code. Windows 10+: download Sigilbound-Windows.zip, unzip it, run Sigilbound.exe
            (Windows may warn about an unknown publisher: More info > Run anyway).
        # Replace the APK in place (never delete the release first, so the link keeps working).
        run: |
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "retry $i: $*"; sleep $((i * 15)); done; return 1; }  # GitHub API 500s happen
          NOTES="Sigilbound (Unity) v$VERSION, build $BUILD (${GITHUB_SHA::7}, branch ${GITHUB_REF_NAME}, $(date -u +%Y-%m-%d)). $NOTES_TAIL"
          TITLE="Sigilbound (Unity) for Android v$VERSION (build $BUILD)"
          if gh release view unity-latest >/dev/null 2>&1; then
            for a in $(gh release view unity-latest --json assets -q '.assets[].name' | grep '^Sigilbound-Unity-' || true); do
              gh release delete-asset unity-latest "$a" --yes || true
            done
            retry gh release upload unity-latest Sigilbound-Unity.apk "Sigilbound-Unity-$VERSION-build$BUILD.apk" --clobber
            retry gh release edit unity-latest --title "$TITLE" --notes "$NOTES"
          else
            gh release create unity-latest Sigilbound-Unity.apk "Sigilbound-Unity-$VERSION-build$BUILD.apk" --prerelease \
              --title "$TITLE" --notes "$NOTES"
          fi

  windows:
    # After linux-preview (one license seat: never two builds at once) and publish-android (never two
    # jobs editing unity-latest at once). Builds even if the Android build or the smoke failed, so one
    # platform's problem doesn't hide another's; only the publish step needs the smoke to have passed.
    needs: [checks, secrets, android, linux-preview, publish-android]
    if: ${{ !cancelled() && needs.secrets.outputs.can_build == 'true' && github.event_name != 'pull_request' && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: sigilbound-unity-windows-release
      cancel-in-progress: false
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Prepare hero models and version
        run: |
          (cd unity/Tools~/models && npm ci --no-audit --no-fund && node prepare-models.mjs)
          echo "${{ github.run_number }}" > unity/build-number.txt
          VERSION=$(node -p "require('fs').readFileSync('public/game/version.js','utf8').match(/version: \"([^\"]+)\"/)[1]")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: unity/Library
          key: unity-library-windows-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('unity/Assets/**') }}
          restore-keys: |
            unity-library-windows-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-
            unity-library-windows-
      - name: Build for Windows (game-ci)
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          cliVersion: v0.1.77
          projectPath: unity
          targetPlatform: StandaloneWindows64
          buildName: Sigilbound
          buildMethod: Sigilbound.EditorTools.BuildScript.Windows
          versioning: None
          allowDirtyBuild: true
      - name: Zip the Windows build
        run: |
          EXE=$(find build unity/build unity/Builds -name 'Sigilbound.exe' 2>/dev/null | head -n 1)
          if [ -z "$EXE" ]; then echo "::error::No Windows build was produced"; exit 1; fi
          DIR=$(dirname "$EXE")
          sudo chown -R "$(id -u)" "$DIR" || true
          # Debug symbols aren't needed to play.
          find "$DIR" -maxdepth 1 -name '*_BurstDebugInformation_DoNotShip' -exec rm -rf {} + || true
          rm -rf Sigilbound-Windows && cp -r "$DIR" Sigilbound-Windows
          (cd Sigilbound-Windows/.. && zip -qr9 Sigilbound-Windows.zip Sigilbound-Windows)
          cp Sigilbound-Windows.zip "Sigilbound-Windows-$VERSION-build$BUILD.zip"
          ls -la Sigilbound-Windows*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sigilbound-unity-windows
          path: Sigilbound-Windows-*.zip
      - name: Publish to the unity-latest release
        # Main only, and only when the Linux smoke tour of the same commit passed.
        if: github.ref == 'refs/heads/main' && needs.linux-preview.outputs.smoke == 'passed'
        env:
          GH_TOKEN: ${{ github.token }}
        # Only touches the Windows files, so the Android APKs on the same release stay as they are.
        run: |
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "retry $i: $*"; sleep $((i * 15)); done; return 1; }  # GitHub API 500s happen
          if ! gh release view unity-latest >/dev/null 2>&1; then
            gh release create unity-latest --prerelease --title "Sigilbound (Unity) test builds" \
              --notes "Sigilbound (Unity) test builds. Android: Sigilbound-Unity.apk. Windows 10+: Sigilbound-Windows.zip (unzip, then run Sigilbound.exe)." || true
          fi
          for a in $(gh release view unity-latest --json assets -q '.assets[].name' | grep '^Sigilbound-Windows-' || true); do
            gh release delete-asset unity-latest "$a" --yes || true
          done
          retry gh release upload unity-latest Sigilbound-Windows.zip "Sigilbound-Windows-$VERSION-build$BUILD.zip" --clobber

  # Fallback: headless web activation to get a .ulf license file (needs the Unity account's
  # two-step verification OFF, or UNITY_TOTP_KEY). Unity has been restricting manual activation
  # for Personal licenses, so this may stop working; account activation above is preferred.
  # Manual only (Run workflow > task "build-store-aab"): the Google Play app bundle (BuildScript.AndroidStore:
  # signed with the private upload key from the secrets above, in-app updater left out). Uploaded as a
  # workflow artifact for the Play Console; it is never published to the public releases.
  android-store:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'build-store-aab'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: sigilbound-unity-release
      cancel-in-progress: false
    steps:
      - name: Check the store secrets
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASS }}
          KA: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$UNITY_EMAIL" ] || missing="$missing UNITY_EMAIL"
          [ -n "$KS" ] || missing="$missing ANDROID_UPLOAD_KEYSTORE_BASE64"
          [ -n "$KSP" ] || missing="$missing ANDROID_UPLOAD_KEYSTORE_PASS"
          [ -n "$KA" ] || missing="$missing ANDROID_UPLOAD_KEY_ALIAS"
          if [ -n "$missing" ]; then echo "::error::Store build needs these repository secrets:$missing (see docs/sigilbound/store/PLAY_CONSOLE.md)"; exit 1; fi
      - name: Free disk space (the Unity Android image is large)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Prepare hero models and build number
        run: |
          (cd unity/Tools~/models && npm ci --no-audit --no-fund && node prepare-models.mjs)
          echo "${{ github.run_number }}" > unity/build-number.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: unity/Library
          key: unity-library-android-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('unity/Assets/**') }}
          restore-keys: |
            unity-library-android-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-
            unity-library-android-
      - name: Build the app bundle (game-ci)
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          cliVersion: v0.1.77
          projectPath: unity
          targetPlatform: Android
          buildMethod: Sigilbound.EditorTools.BuildScript.AndroidStore
          versioning: None
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidAppBundle
          androidKeystoreName: upload.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_UPLOAD_KEY_PASS }}
          allowDirtyBuild: true
      - name: Find the bundle
        run: |
          AAB=$(find build unity/build unity/Builds -name '*.aab' 2>/dev/null | head -n 1)
          if [ -z "$AAB" ]; then echo "::error::No app bundle was produced"; exit 1; fi
          cp "$AAB" "Sigilbound-store-build${{ github.run_number }}.aab"; ls -la Sigilbound-store-*.aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sigilbound-store-aab
          path: Sigilbound-store-*.aab

  get-license-file:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'get-license-file'
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Add the UNITY_EMAIL and UNITY_PASSWORD repository secrets first (see unity/README.md)."; exit 1
          fi
      - name: Make an activation request file (.alf) with Unity 6000.0.58f1
        id: alf
        # game-ci's old request-activation-file action is retired, so run the editor image directly.
        run: |
          mkdir -p alf && cd alf
          docker run --rm -v "$PWD":/work -w /work unityci/editor:ubuntu-6000.0.58f1-base-3 \
            unity-editor -batchmode -nographics -createManualActivationFile -logFile /dev/stdout -quit || true
          ALF=$(ls -1 "$PWD"/*.alf 2>/dev/null | head -n 1)
          if [ -z "$ALF" ]; then echo "::error::Unity didn't write an .alf file (Unity may no longer allow manual activation for Personal licenses). Use account activation instead: UNITY_EMAIL + UNITY_PASSWORD only."; exit 1; fi
          echo "filePath=$ALF" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Activate on license.unity3d.com (headless browser)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_TOTP_KEY: ${{ secrets.UNITY_TOTP_KEY }}
          ALF: ${{ steps.alf.outputs.filePath }}
        run: |
          npm install --global unity-license-activate@0.3.9
          EXTRA=""
          if [ -n "$UNITY_TOTP_KEY" ]; then EXTRA="--authenticator-key $UNITY_TOTP_KEY"; fi
          unity-license-activate "$UNITY_EMAIL" "$UNITY_PASSWORD" "$ALF" $EXTRA
          ULF=$(ls -1 *.ulf 2>/dev/null | head -n 1)
          if [ -z "$ULF" ]; then echo "::error::No .ulf was produced. Turn off two-step verification on the Unity account (or add UNITY_TOTP_KEY) and try again, or use account activation (UNITY_EMAIL + UNITY_PASSWORD only)."; exit 1; fi
          mv "$ULF" Unity_lic.ulf
      - name: Save it as the UNITY_LICENSE secret (if GH_SECRETS_TOKEN is set)
        id: save
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set UNITY_LICENSE --repo "$GITHUB_REPOSITORY" < Unity_lic.ulf
            echo "saved=true" >> "$GITHUB_OUTPUT"
            echo "UNITY_LICENSE secret saved. You can delete GH_SECRETS_TOKEN now if you like."
          else
            echo "saved=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Download the 'unity-license' artifact below, open Unity_lic.ulf, copy all of its text and paste it into a new repository secret named UNITY_LICENSE. The artifact is deleted after 1 day."
          fi
      - name: Upload the license file (deleted after 1 day)
        if: steps.save.outputs.saved != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-license
          path: Unity_lic.ulf
          retention-days: 1
