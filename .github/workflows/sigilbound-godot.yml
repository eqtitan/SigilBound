name: Sigilbound Godot

# Builds the Godot demo (godot/) into an installable Android APK, with no accounts or secrets:
# Godot needs no license. Every push that touches godot/ runs the web-parity tests and a
# headless smoke battle, exports a debug APK signed with the permanent test keystore (so new
# builds install over old ones), and publishes it to the "godot-latest" pre-release:
# https://github.com/eqtitan/SigilBound/releases/tag/godot-latest

on:
  push:
    # Only main publishes to the download links; other branches (work in progress) never do.
    branches: [main]
    paths: ["godot/**", ".github/workflows/sigilbound-godot.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"
  # From the release's SHA512-SUMS.txt.
  GODOT_EDITOR_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  GODOT_TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
  BUILD_TOOLS: "35.0.0"

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: sigilbound-godot-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22

      - name: Check the parity fixtures are current (warning only)
        run: |
          cp godot/tests/fixtures/parity.json /tmp/parity.committed.json
          node godot/tests/make-fixtures.cjs
          if ! cmp -s godot/tests/fixtures/parity.json /tmp/parity.committed.json; then
            echo "::warning::public/game rules changed since godot/tests/fixtures/parity.json was generated. Port the rule change to godot/scripts/core and regenerate (node godot/tests/make-fixtures.cjs)."
          fi
          # The tests run against the committed fixtures, so web-side changes don't block the APK.
          cp /tmp/parity.committed.json godot/tests/fixtures/parity.json

      - name: Download Godot ${{ env.GODOT_RELEASE }} (editor + export templates)
        run: |
          base="https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE"
          mkdir -p "$RUNNER_TEMP/godot" && cd "$RUNNER_TEMP/godot"
          curl -fsSL --retry 4 -o editor.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL --retry 4 -o templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          echo "$GODOT_EDITOR_SHA512  editor.zip" | sha512sum -c -
          echo "$GODOT_TEMPLATES_SHA512  templates.tpz" | sha512sum -c -
          unzip -q editor.zip
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"
          # Only the Android templates are needed (the archive is ~1.3 GB).
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -q -j templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$tdir"
          rm templates.tpz
          cat "$tdir/version.txt"

      - name: Parity tests and smoke battle (headless)
        run: godot/tests/run.sh "$GODOT"

      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3.2.2
        with:
          packages: "platform-tools build-tools;35.0.0"

      - name: Configure the Android export
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\n' \
            "$JAVA_HOME" "$ANDROID_SDK_ROOT" > "$HOME/.config/godot/editor_settings-4.7.tres"
          BUILD="${{ github.run_number }}"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          VERSION=$(sed -n 's/^const VERSION := "\(.*\)"/\1/p' godot/scripts/game.gd)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Stamp the build so the title screen shows exactly what's installed.
          sed -i "s/^const BUILD := \"dev\"/const BUILD := \"build $BUILD · ${GITHUB_SHA::7}\"/" godot/scripts/game.gd
          sed -i "s/^version\/code=.*/version\/code=$BUILD/; s/^version\/name=.*/version\/name=\"$VERSION.$BUILD\"/" godot/export_presets.cfg
          grep -E "^version/|^package/" godot/export_presets.cfg

      - name: Export the debug APK
        env:
          # The permanent test keystore (mobile/android/app/build.gradle), so updates install over each other.
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/mobile/android/app/sigilbound-test.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: sigilbound-test
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: sigilbound-test
        run: |
          cd godot
          mkdir -p build
          "$GODOT" --headless --import --path . > /dev/null 2>&1 || true
          "$GODOT" --headless --path . --export-debug Android build/Sigilbound-Godot.apk 2>&1 | tee export.log
          test -s build/Sigilbound-Godot.apk
          if grep -q "The resulting APK is unsigned" export.log; then echo "::error::APK was not signed"; exit 1; fi
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs build/Sigilbound-Godot.apk
          cp build/Sigilbound-Godot.apk ../Sigilbound-Godot.apk
          ls -la ../Sigilbound-Godot.apk

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sigilbound-godot-android
          path: Sigilbound-Godot.apk

      - name: Publish to the godot-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_TAIL: >-
            Sigilbound — Godot demo: pick a starter and fight through Chapter 1 with 3D battles.
            On an Android phone: download Sigilbound-Godot.apk, open it, and allow installs from your
            browser if asked. It installs as a separate app, "Sigilbound (Godot)", next to the regular
            one; newer builds install over older ones and keep the demo's progress.
        # Replace the APK in place (never delete the release first, so the download link never breaks).
        run: |
          NOTES="Godot demo v$VERSION, build $BUILD (${GITHUB_SHA::7}, $(date -u +%Y-%m-%d)). $NOTES_TAIL"
          TITLE="Sigilbound Godot demo v$VERSION (build $BUILD)"
          if gh release view godot-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload godot-latest Sigilbound-Godot.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit godot-latest --title "$TITLE" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create godot-latest Sigilbound-Godot.apk --prerelease --title "$TITLE" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          fi
